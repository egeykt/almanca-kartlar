name: Instagram paylaşımı

on:
  schedule:
    - cron: '30 9 * * *'   # 12:30 Türkiye
    - cron: '0 17 * * *'   # 20:00 Türkiye
  workflow_dispatch:

permissions:
  contents: write

concurrency: instagram

jobs:
  paylas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sıradaki kartı paylaş
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node instagram/paylas.mjs
      - name: Sırayı kaydet
        run: |
          git config user.name "turkce_dusunme bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/durum.json
          git diff --cached --quiet || (git commit -m "Paylaşılan kart: $(jq .son.id instagram/durum.json)" && git push)
