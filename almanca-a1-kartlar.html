<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Almanca A1 Kelime Kartları</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 12px 32px;
  color: #fff;
}

h1 {
  font-size: clamp(1.3rem, 5vw, 1.8rem);
  margin-bottom: 3px;
  letter-spacing: 1px;
  color: #e2b96f;
}
.subtitle {
  font-size: clamp(0.72rem, 3vw, 0.82rem);
  color: #aaa;
  margin-bottom: 16px;
  text-align: center;
}

/* ── Kategoriler — wrap (seçilebilir) ── */
.categories {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 16px;
  width: 100%;
  max-width: 540px;
}
.cat-btn {
  padding: 7px 14px;
  border: 2px solid #e2b96f;
  background: transparent;
  color: #e2b96f;
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.76rem;
  white-space: nowrap;
  transition: all .2s;
  min-height: 36px;
}
.cat-btn.active, .cat-btn:hover {
  background: #e2b96f;
  color: #1a1a2e;
  font-weight: 700;
}

/* ── Progress ── */
.progress-wrap {
  width: min(360px, 92vw);
  margin-bottom: 12px;
}
.progress-info {
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  color: #ccc;
  margin-bottom: 6px;
}
.progress-bar-bg {
  height: 6px;
  background: rgba(255,255,255,0.15);
  border-radius: 3px;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  background: #e2b96f;
  border-radius: 3px;
  transition: width .4s;
}

/* ── Kart ── */
.card-area {
  perspective: 1200px;
  width: min(360px, 92vw);
  height: clamp(210px, 55vw, 250px);
  margin-bottom: 20px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.card {
  width: 100%; height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(.4,1.2,.6,1);
}
.card.flipped { transform: rotateY(180deg); }

.card-face {
  position: absolute; inset: 0;
  border-radius: 20px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  padding: 18px 20px;
  text-align: center;
  box-shadow: 0 12px 40px rgba(0,0,0,.5);
}
.front { background: linear-gradient(135deg, #e2b96f, #c8973c); color: #1a1a2e; }
.back  { background: linear-gradient(135deg, #2c6e9c, #1a4a72); color: #fff; transform: rotateY(180deg); }

.card-label {
  font-size: 0.62rem; letter-spacing: 2px;
  text-transform: uppercase; opacity: 0.55; margin-bottom: 4px;
}
.card-word {
  font-size: clamp(1.5rem, 6.5vw, 2.1rem);
  font-weight: 800; letter-spacing: 0.5px; line-height: 1.15;
}
.card-plural {
  font-size: clamp(0.72rem, 2.5vw, 0.82rem);
  margin-top: 5px; opacity: 0.7;
  background: rgba(0,0,0,0.12);
  padding: 2px 10px; border-radius: 8px;
}
.card-category {
  font-size: 0.65rem; margin-top: 6px;
  background: rgba(0,0,0,0.15);
  padding: 2px 10px; border-radius: 8px;
}
.sound-row {
  display: flex; align-items: center;
  gap: 8px; margin-top: 8px;
}
.btn-sound {
  background: rgba(0,0,0,0.12); border: none; cursor: pointer;
  font-size: 1.15rem; padding: 6px 10px;
  border-radius: 10px; line-height: 1;
  min-width: 44px; min-height: 36px;
  transition: transform .15s;
}
.btn-sound:active { transform: scale(0.9); }
.btn-sound.playing { animation: pulse .5s ease-in-out infinite alternate; }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.2); } }

.auto-toggle {
  font-size: 0.66rem; background: rgba(0,0,0,0.18);
  border: none; color: inherit;
  padding: 5px 10px; border-radius: 10px;
  cursor: pointer; opacity: 0.7; white-space: nowrap; min-height: 32px;
}
.auto-toggle.on { opacity: 1; font-weight: 700; }
.flip-hint { font-size: 0.65rem; opacity: 0.45; margin-top: 8px; }

/* ── Kontroller ── */
.controls {
  display: flex; gap: 10px;
  align-items: center; margin-bottom: 14px;
}
.btn {
  padding: 12px 18px; border: none; border-radius: 14px;
  font-size: 0.92rem; font-weight: 700; cursor: pointer;
  transition: transform .15s, opacity .15s; min-height: 48px;
}
.btn:active { transform: scale(0.93); }
.btn-nav {
  background: rgba(255,255,255,0.12); color: #fff;
  font-size: 1.3rem; padding: 12px 18px; min-width: 52px;
}
.btn-nav:hover  { background: rgba(255,255,255,0.22); }
.btn-nav:disabled { opacity: 0.3; cursor: default; }
.btn-shuffle { background: #e2b96f; color: #1a1a2e; font-size: 0.88rem; padding: 12px 16px; }

/* ── Biliyor/Bilmiyor ── */
.result-btns {
  display: flex; gap: 10px;
  width: min(360px, 92vw);
}
.btn-known, .btn-unknown {
  flex: 1; color: #fff; border: none;
  padding: 14px 10px; border-radius: 14px;
  font-weight: 700; font-size: 0.9rem; cursor: pointer;
  min-height: 50px; transition: transform .15s;
}
.btn-known   { background: #2ecc71; }
.btn-unknown { background: #e74c3c; }
.btn-known:active, .btn-unknown:active { transform: scale(0.95); }

.stats {
  font-size: 0.8rem; color: #aaa;
  margin-top: 14px; display: flex; gap: 20px;
}
.stat-known   { color: #2ecc71; font-weight: 700; }
.stat-unknown { color: #e74c3c; font-weight: 700; }

.audio-error {
  font-size: 0.72rem; color: #f39c12;
  margin-top: 8px; display: none; text-align: center;
}
</style>
</head>
<body>

<h1>🇩🇪 Almanca A1</h1>
<p class="subtitle">Karta dokun — çeviriyi gör &nbsp;|&nbsp; 🔊 sesini duy</p>

<div class="categories" id="catBtns"></div>

<div class="progress-wrap">
  <div class="progress-info">
    <span id="cardIndex">1 / 1</span>
    <span id="catLabel">Tümü</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>
</div>

<div class="card-area" ontouchstart="" onclick="handleCardTap()">
  <div class="card" id="card">
    <div class="card-face front">
      <div class="card-label">Almanca</div>
      <div class="card-word"   id="frontWord">—</div>
      <div class="card-plural" id="frontPlural" style="display:none"></div>
      <div class="sound-row">
        <button class="btn-sound" id="btnSoundDE"
          onclick="event.stopPropagation(); speakDE()" title="Seslet">🔊</button>
        <button class="auto-toggle on" id="autoToggle"
          onclick="event.stopPropagation(); toggleAuto()">🔁 Otomatik</button>
      </div>
      <div class="card-category" id="frontCat"></div>
      <div class="flip-hint">👆 çevirmek için dokun</div>
    </div>
    <div class="card-face back">
      <div class="card-label">Türkçe</div>
      <div class="card-word" id="backWord">—</div>
      <button class="btn-sound" id="btnSoundTR"
        onclick="event.stopPropagation(); speakTR()"
        style="margin-top:12px">🔊</button>
    </div>
  </div>
</div>

<div class="controls">
  <button class="btn btn-nav" id="prevBtn" onclick="prevCard()">◀</button>
  <button class="btn btn-shuffle" onclick="shuffleCards()">🔀 Karıştır</button>
  <button class="btn btn-nav" id="nextBtn" onclick="nextCard()">▶</button>
</div>

<div class="result-btns" id="resultBtns" style="display:none">
  <button class="btn btn-unknown" onclick="markCard(false)">✗ Bilmiyorum</button>
  <button class="btn btn-known"   onclick="markCard(true)">✓ Biliyorum</button>
</div>

<div class="stats">
  <span>Biliyor: <span class="stat-known"   id="knownCount">0</span></span>
  <span>Bilmiyor: <span class="stat-unknown" id="unknownCount">0</span></span>
</div>
<p class="audio-error" id="audioError">⚠️ Ses yüklenemedi</p>
<p style="margin-top:22px;font-size:0.68rem;color:rgba(255,255,255,0.22);letter-spacing:1px;">created by fege</p>

// SES — Google Translate TTS (gerçek Almanca aksanı)
//        Yedek: Web Speech API
// ─────────────────────────────────────────────────────────────────────────────
let autoPlay     = true;
let currentAudio = null;

/* ---- Google TTS ---- */
function playGoogle(text, lang, btnId) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  const btn = document.getElementById(btnId);
  const url = 'https://translate.google.com/translate_tts'
            + '?ie=UTF-8&client=tw-ob&tl=' + lang
            + '&q=' + encodeURIComponent(text);

  currentAudio = new Audio(url);
  // crossOrigin YOK — Google TTS CORS başlığı göndermez, olursa engellenir
  if (btn) btn.classList.add('playing');
  document.getElementById('audioError').style.display = 'none';

  currentAudio.onended = () => { if (btn) btn.classList.remove('playing'); currentAudio = null; };
  currentAudio.onerror = () => {
    if (btn) btn.classList.remove('playing');
    currentAudio = null;
    // Google TTS başarısız → Web Speech API yedek
    speakBrowser(text, lang === 'de' ? 'de-DE' : 'tr-TR', btnId);
  };
  currentAudio.play().catch(() => {
    if (btn) btn.classList.remove('playing');
    // Autoplay engeli (ilk sayfa yüklemesi) — kullanıcı 🔊'a bassın
  });
}

/* ---- Yedek: Web Speech API ---- */
function speakBrowser(text, lang, btnId) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  if (window.speechSynthesis.paused) window.speechSynthesis.resume();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang  = lang; utt.rate = 0.82;
  const voices = window.speechSynthesis.getVoices();
  const match  = voices.find(v => v.lang === lang)
              || voices.find(v => v.lang.startsWith(lang.slice(0,2)));
  if (match) utt.voice = match;
  const btn = document.getElementById(btnId);
  utt.onstart = () => { if (btn) btn.classList.add('playing'); };
  utt.onend   = () => { if (btn) btn.classList.remove('playing'); };
  utt.onerror = () => {
    if (btn) btn.classList.remove('playing');
    document.getElementById('audioError').style.display = 'block';
  };
  setTimeout(() => window.speechSynthesis.speak(utt), 50);
}

function speakDE() { playGoogle(deck[index].de, 'de', 'btnSoundDE'); }
function speakTR() { playGoogle(deck[index].tr, 'tr', 'btnSoundTR'); }

function toggleAuto() {
  autoPlay = !autoPlay;
  const btn = document.getElementById('autoToggle');
  btn.textContent = autoPlay ? '🔁 Otomatik' : '🔇 Otomatik';
  btn.classList.toggle('on', autoPlay);
}

// STATE
// ─────────────────────────────────────────────────────────────────────────────
let deck       = [...ALL_CARDS];
let index      = 0;
let flipped    = false;
let known      = 0;
let unknown    = 0;
let currentCat = "Tümü";

// ─────────────────────────────────────────────────────────────────────────────
// KATEGORİ BUTONLARI
// ─────────────────────────────────────────────────────────────────────────────
function buildCatButtons() {
  const cats = ["Tümü", ...new Set(ALL_CARDS.map(c => c.cat))];
  const wrap = document.getElementById("catBtns");
  cats.forEach(cat => {
    const b = document.createElement("button");
    b.className = "cat-btn" + (cat === "Tümü" ? " active" : "");
    b.textContent = cat;
    b.onclick = () => selectCat(cat);
    wrap.appendChild(b);
  });
}

function selectCat(cat) {
  currentCat = cat;
  document.querySelectorAll(".cat-btn").forEach(b =>
    b.classList.toggle("active", b.textContent === cat));
  deck    = cat === "Tümü" ? [...ALL_CARDS] : ALL_CARDS.filter(c => c.cat === cat);
  index   = 0; known = 0; unknown = 0;
  updateStatDisplay();
  renderCard(false);
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────────────────────
function renderCard(withAudio = true) {
  const c = deck[index];
  document.getElementById("frontWord").textContent = c.de;

  // Çoğul
  const pluralEl = document.getElementById("frontPlural");
  if (c.plural && c.plural !== "—") {
    pluralEl.textContent = "Çoğul: " + c.plural;
    pluralEl.style.display = "block";
  } else if (c.plural === "—") {
    pluralEl.textContent = "Çoğul yok (sayılamaz)";
    pluralEl.style.display = "block";
  } else {
    pluralEl.style.display = "none";
  }

  document.getElementById("frontCat").textContent = c.cat;
  document.getElementById("backWord").textContent  = c.tr;

  flipped = false;
  document.getElementById("card").classList.remove("flipped");
  document.getElementById("resultBtns").style.display = "none";

  document.getElementById("cardIndex").textContent   = `${index + 1} / ${deck.length}`;
  document.getElementById("catLabel").textContent    = currentCat;
  document.getElementById("progressBar").style.width = ((index + 1) / deck.length * 100) + "%";
  document.getElementById("prevBtn").disabled = index === 0;
  document.getElementById("nextBtn").disabled = index === deck.length - 1;

  if (withAudio && autoPlay) speakDE();
}

// ─────────────────────────────────────────────────────────────────────────────
// KART DOKUNUŞ
// ─────────────────────────────────────────────────────────────────────────────
function handleCardTap() {
  flipped = !flipped;
  document.getElementById("card").classList.toggle("flipped", flipped);
  document.getElementById("resultBtns").style.display = flipped ? "flex" : "none";
}

function nextCard()    { if (index < deck.length - 1) { index++; renderCard(true); } }
function prevCard()    { if (index > 0)               { index--; renderCard(true); } }

function shuffleCards() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  index = 0; known = 0; unknown = 0;
  updateStatDisplay(); renderCard(true);
}

function markCard(isKnown) {
  if (isKnown) known++; else unknown++;
  updateStatDisplay();
  if (index < deck.length - 1) { index++; renderCard(true); }
  else {
    document.getElementById("resultBtns").style.display = "none";
    setTimeout(() => alert(
      `Tur bitti!\n✓ Biliyor: ${known}  ✗ Bilmiyor: ${unknown}\n\nTekrar için 🔀 Karıştır'a bas.`
    ), 100);
  }
}

function updateStatDisplay() {
  document.getElementById("knownCount").textContent   = known;
  document.getElementById("unknownCount").textContent = unknown;
}

// Klavye
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight")                nextCard();
  else if (e.key === "ArrowLeft")            prevCard();
  else if (e.key === " ")                    { e.preventDefault(); handleCardTap(); }
  else if (e.key === "1")                   markCard(true);
  else if (e.key === "2")                   markCard(false);
  else if (e.key === "s" || e.key === "S")  flipped ? speakTR() : speakDE();
});

buildCatButtons();
renderCard(false);
</script>
</body>
</html>
